name: Generate Exercise Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate exercise catalog
        run: python tools/generate_exercise_catalog.py --output exercise_catalog_ro.jsonl

      - name: Show catalog preview
        run: |
          wc -l exercise_catalog_ro.jsonl
          head -n 10 exercise_catalog_ro.jsonl

      - name: Commit generated exercise catalog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate IronVexel exercise catalog
          file_pattern: exercise_catalog_ro.jsonl
